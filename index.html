<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamoliddin's Weekly Timetable</title>
<meta name="description" content="Weekly timetable — Fall 2026, Zhejiang University of Technology, Pingfeng Campus">
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #eef0f4; --border: #e5e7eb;
    --accent: #4f46e5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.4;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }

  /* Header */
  header {
    background: linear-gradient(120deg, #4f46e5, #7c3aed);
    color: #fff; border-radius: 20px; padding: 22px;
    box-shadow: 0 10px 30px rgba(79, 70, 229, .25);
  }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  h1 { font-size: 28px; margin-top: 4px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
  .stat { background: rgba(255, 255, 255, .15); border-radius: 14px; padding: 10px 12px; }
  .stat small { display: block; font-size: 12px; opacity: .85; }
  .stat b { font-size: 20px; }

  /* Toolbar */
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin: 16px 0 12px; }
  .left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toggle { display: inline-flex; background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 4px; }
  .toggle button {
    border: 0; background: none; padding: 7px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .toggle button.on { background: var(--accent); color: #fff; }
  .print { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: #374151; cursor: pointer; }
  .print:hover { background: #f3f4f6; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: #4b5563; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }

  /* Week view */
  .scroll { overflow-x: auto; }
  .week { min-width: 860px; }
  .whead { display: flex; border-bottom: 1px solid var(--border); }
  .gut { width: 50px; flex: none; }
  .whead button {
    flex: 1; border: 0; background: none; padding: 10px 0; font-weight: 700; font-size: 14px;
    color: #374151; cursor: pointer; border-radius: 10px 10px 0 0;
  }
  .whead button:hover { background: #eef2ff; color: var(--accent); }
  .whead button.today { color: var(--accent); }
  .whead button.today::after { content: " •"; }
  .wbody { display: flex; position: relative; margin: 8px 0; }
  .times { width: 50px; flex: none; position: relative; }
  .times div { position: absolute; right: 8px; font-size: 11px; color: #9ca3af; transform: translateY(-50%); font-variant-numeric: tabular-nums; }
  .col { flex: 1; position: relative; border-left: 1px solid var(--line); cursor: pointer; }
  .col:last-child { border-right: 1px solid var(--line); }
  .hl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
  .blk { position: absolute; left: 3px; right: 3px; border-radius: 7px; padding: 2px 5px; overflow: hidden; font-size: 10.5px; line-height: 13px; }
  .blk b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk b.multi { white-space: normal; }
  .blk em { display: block; font-style: normal; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .sleep { background: #334155; color: #e2e8f0; }
  .now { position: absolute; left: 0; right: 0; height: 2px; background: #ef4444; z-index: 5; pointer-events: none; }
  .now::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* Block colours */
  .b-class   { background: #4f46e5; color: #fff; }
  .b-work    { background: #059669; color: #fff; }
  .b-prog    { background: #9333ea; color: #fff; }
  .b-chinese { background: #ea580c; color: #fff; }
  .b-gym     { background: #e11d48; color: #fff; }
  .b-meal    { background: #fcd34d; color: #78350f; }
  .b-chores  { background: #0d9488; color: #fff; }
  .b-free    { background: #fbcfe8; color: #831843; }
  .b-routine { background: #e2e8f0; color: #334155; }

  /* Day view */
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .tabs button {
    border: 0; padding: 7px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    background: #f3f4f6; color: #4b5563; cursor: pointer; flex: none;
  }
  .tabs button.on { background: var(--accent); color: #fff; box-shadow: 0 2px 6px rgba(79,70,229,.3); }
  .dhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0; }
  .dhead h2 { font-size: 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .row { display: flex; gap: 12px; margin-bottom: 8px; }
  .row .t { width: 104px; flex: none; font-size: 12px; color: var(--muted); padding-top: 10px; font-variant-numeric: tabular-nums; }
  .item { flex: 1; border-left: 4px solid; border-radius: 0 12px 12px 0; padding: 8px 12px; }
  .item .top { display: flex; justify-content: space-between; gap: 8px; }
  .item .top b { font-size: 14px; }
  .item .top span { font-size: 12px; opacity: .6; flex: none; }
  .item p { font-size: 12px; opacity: .85; margin-top: 2px; }
  .item.sleep-row { border-left-color: #334155; border-radius: 12px; }

  .d-class   { background: #eef2ff; border-color: #4f46e5; color: #312e81; }
  .d-work    { background: #ecfdf5; border-color: #059669; color: #064e3b; }
  .d-prog    { background: #faf5ff; border-color: #9333ea; color: #581c87; }
  .d-chinese { background: #fff7ed; border-color: #ea580c; color: #7c2d12; }
  .d-gym     { background: #fff1f2; border-color: #e11d48; color: #881337; }
  .d-meal    { background: #fffbeb; border-color: #f59e0b; color: #78350f; }
  .d-chores  { background: #f0fdfa; border-color: #0d9488; color: #134e4a; }
  .d-free    { background: #fdf2f8; border-color: #f472b6; color: #831843; }
  .d-routine { background: #f8fafc; border-color: #cbd5e1; color: #334155; }

  /* Bottom cards */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  h3 { font-size: 16px; margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-weight: 600; color: var(--muted); padding-bottom: 8px; }
  td { padding: 6px 0; border-top: 1px solid #f3f4f6; }
  .pill { padding: 2px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ok { background: #d1fae5; color: #065f46; }
  .low { background: #fef3c7; color: #92400e; }
  .none { background: #f3f4f6; color: #6b7280; }
  .cls { background: #e0e7ff; color: #3730a3; }
  .notes li { list-style: none; font-size: 14px; color: #374151; margin-bottom: 10px; }
  .notes b { color: var(--text); }

  footer { text-align: center; font-size: 12px; color: var(--muted); margin: 24px 0 8px; }

  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid2 { grid-template-columns: 1fr; }
    h1 { font-size: 22px; }
    .row .t { width: 84px; font-size: 11px; }
  }
  @media print {
    body { background: #fff; }
    .bar, .tabs, .hint, .print, .now { display: none !important; }
    header { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .blk, .item, .chip, .pill, .sleep { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .card { box-shadow: none; }
    .scroll { overflow: visible; }
  }
</style>
</head>

const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };

const dur = it => toMin(it[1]) - toMin(it[0]);

  const sess = list => list.length
    ? list.map(m => `<span class="pill ${m >= 60 ? "ok" : "low"}">${fmt(m)}</span>`).join(" ")
    : `<span class="pill none">—</span>`;
  const rows = WEEK.map(d => {
    const work = sum(d, "work");
    const ch = sessions(d, "chinese");
    const hasClass = d.items.some(i => i[2] === "class" && i[3] === "Practical Chinese");
    const chCell = !ch.length && hasClass ? `<span class="pill cls">Class</span>` : sess(ch);
    return `<tr>
      <td><b>${d.day}</b></td>
      <td><span class="pill ok">${fmt(work)}</span></td>
      <td>${sess(sessions(d, "prog"))}</td>
      <td>${chCell}</td>
    </tr>`;
  }).join("");
  document.getElementById("targets").innerHTML =
    `<table><thead><tr><th>Day</th><th>Work</th><th>Programming</th><th>Chinese</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- week view ---------- */
function renderWeek() {
  const t = todayIdx();
  const hours = [];
  for (let h = 5; h <= 23; h++) hours.push(h);
  const height = (END - START) * PX;

  const head = `<div class="whead"><div class="gut"></div>${WEEK.map((d, i) =>
    `<button data-day="${i}" class="${i === t ? "today" : ""}">${d.day}</button>`).join("")}</div>`;

  const times = `<div class="times">${hours.map(h =>
    `<div style="top:${(h * 60 - START) * PX}px">${String(h).padStart(2, "0")}:00</div>`).join("")}</div>`;

  const cols = WEEK.map((d, i) => {
    const lines = hours.map(h => `<div class="hl" style="top:${(h * 60 - START) * PX}px"></div>`).join("");
    const sleepTop = `<div class="blk sleep" style="top:1px;height:${(toMin("05:20") - START) * PX - 2}px"></div>`;
    const sleepBot = `<div class="blk sleep" style="top:${(toMin(d.sleep) - START) * PX + 1}px;height:${(END - toMin(d.sleep)) * PX - 2}px"><b>Sleep ${d.sleep}</b></div>`;
    const blocks = d.items.map(it => {
      const h = dur(it) * PX;
      const room = it[2] === "class" ? it[4].split(" · ")[0] : "";
      let inner = "";
      if (h >= 14) inner += `<b class="${h >= 60 ? "multi" : ""}" style="padding-top:${h >= 30 ? 2 : 0}px">${esc(it[3])}</b>`;
      if (h >= 60 && room) inner += `<em>${esc(room)}</em>`;
      if (h >= 34) inner += `<em>${it[0]}–${it[1]}</em>`;
      const title = `${it[0]}–${it[1]}  ${it[3]}${it[4] ? " — " + it[4] : ""}`;
      return `<div class="blk b-${it[2]}" title="${esc(title)}" style="top:${(toMin(it[0]) - START) * PX + 1}px;height:${h - 2}px">${inner}</div>`;
    }).join("");
    const now = i === t ? `<div class="now" id="nowline" style="display:none"></div>` : "";
    return `<div class="col" data-day="${i}">${lines}${sleepTop}${blocks}${sleepBot}${now}</div>`;
  }).join("");

  return `<div class="scroll"><div class="week">${head}<div class="wbody" style="height:${height}px">${times}${cols}</div></div></div>
          <div class="hint">Tap any day for the full detailed schedule. The red line shows the current time.</div>`;
}

function updateNowLine() {
  const el = document.getElementById("nowline");
  if (!el) return;
  const d = new Date();
  const mins = d.getHours() * 60 + d.getMinutes();
  if (mins < START || mins > END) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.style.top = `${(mins - START) * PX}px`;
}

/* ---------- day view ---------- */
function renderDay() {
  const d = WEEK[idx];
  const tabs = `<div class="tabs">${WEEK.map((w, i) =>
    `<button data-day="${i}" class="${i === idx ? "on" : ""}">${w.day}</button>`).join("")}</div>`;

  const chip = (txt, bg, fg) => `<span class="chip" style="background:${bg};color:${fg}">${txt}</span>`;
  const cls = sum(d, "class"), work = sum(d, "work"), prog = sum(d, "prog"), ch = sum(d, "chinese"), gym = sum(d, "gym");
  const chips = [
    cls ? chip(`Classes ${fmt(cls)}`, "#e0e7ff", "#3730a3") : "",
    chip(`Work ${fmt(work)}`, "#d1fae5", "#065f46"),
    prog ? chip(`Code ${fmt(prog)}`, "#f3e8ff", "#6b21a8") : "",
    ch ? chip(`Chinese ${fmt(ch)}`, "#ffedd5", "#9a3412") : "",
    gym ? chip("Gym", "#ffe4e6", "#9f1239") : "",
    chip(`Sleep ${fmt(sleepLen(d.sleep))}`, "#e2e8f0", "#1e293b")
  ].join("");

  const rows = d.items.map(it => `
    <div class="row">
      <div class="t">${it[0]} – ${it[1]}</div>
      <div class="item d-${it[2]}">
        <div class="top"><b>${esc(it[3])}</b><span>${fmt(dur(it))}</span></div>
        ${it[4] ? `<p>${esc(it[4])}</p>` : ""}
      </div>
    </div>`).join("");

  const sleepRow = `
    <div class="row">
      <div class="t">${d.sleep}</div>
      <div class="item sleep sleep-row">
        <div class="top"><b>Sleep</b></div>
        <p>Lights out — ${fmt(sleepLen(d.sleep))} until your 05:20 alarm</p>
      </div>
    </div>`;

  return `${tabs}<div class="dhead"><h2>${d.name}</h2><div class="chips">${chips}</div></div>${rows}${sleepRow}`;
}

/* ---------- main render ---------- */
const main = document.getElementById("main");

function render() {
  main.innerHTML = view === "week" ? renderWeek() : renderDay();
  document.querySelectorAll(".toggle button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  if (view === "week") updateNowLine();
}

main.addEventListener("click", e => {
  const el = e.target.closest("[data-day]");
  if (!el) return;
  idx = Number(el.dataset.day);
  view = "day";
  render();
  window.scrollTo({ top: main.offsetTop - 12, behavior: "smooth" });
});

document.querySelectorAll(".toggle button").forEach(b =>
  b.addEventListener("click", () => { view = b.dataset.view; render(); }));

renderTargets();
render();
setInterval(updateNowLine, 60 * 1000);
</script>
</body>
</html>
